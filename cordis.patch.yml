# ============================================================================
# dsh-netease-music —— 插件自带的挂载声明（bundle patch）
# ============================================================================
# 装上之后，profile 的 `dsh.profile.bundles` 里列上本包名即生效；
# 不用手改 profile 自己的 cordis.patch.yml。
#
#   dsh plugin --profile desktop add link:D:\音乐插件
#   （发布到 npm 后就是 dsh plugin --profile desktop add dsh-netease-music）
# ============================================================================

- insert:
    - id: netease-music
      name: dsh-netease-music
      config:
        # 真正的配置在插件自己的 config.json（$DSH_HOME/netease-music/config.json）
        enabled: true
